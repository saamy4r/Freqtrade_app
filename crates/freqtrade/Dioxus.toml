[application]
# Shown under the launcher icon and in the app switcher. Without this the name
# is derived from the crate, which gave "FtUi".
name = "Freqtrade"

[bundle]
# `com.example.*` is a placeholder Google rejects and which says nothing about
# who published the app. Changing it makes Android treat this as a different
# application, so an existing install is replaced rather than upgraded.
identifier = "com.saamyar.freqtrade"
icon = ["assets/icon.png"]

[web.app]
title = "Freqtrade Visualizer"
# Routes are client-side, so a deep link must fall back to index.html.
base_path = ""

# Proxy the API through the dev server so the browser sees one origin. Without
# this the UI on :8080 calling ft-server on :3000 is a cross-origin request,
# and the dev loop would diverge from the shipped build, where ft-server serves
# the UI itself.
[[web.proxy]]
backend = "http://127.0.0.1:3000/api"

[web.watcher]
reload_html = true
