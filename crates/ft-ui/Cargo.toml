[package]
name = "ft-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ft-types.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
dioxus = { version = "0.7", features = ["router"] }
futures-channel = "0.3"
futures-util = "0.3"
# reqwest builds for wasm32 on top of fetch, so one client serves the browser
# dev loop and the Android build alike.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "charset"] }

# Only the browser build needs to ask where it is being served from.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location", "EventSource", "MessageEvent", "EventTarget"] }
# Dates are formatted with the browser's own locale rather than forced to UTC:
# a trade's time is only useful in the reader's timezone.
js-sys = "0.3"
wasm-bindgen = "0.2"

[features]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
